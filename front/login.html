<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CapacitaPro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- 🔵 BIBLIOTECA DO GOOGLE - ADICIONADA AQUI -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="login-body">

<header class="navbar">
<a href="index.html" class="logo-link" style="display: flex; align-items: center; text-decoration: none;">
<img src="png.logo.png" alt="Logo CapacitaPro" style="width: 45px; height: 45px; margin-right: 12px;">
<div class="logo-text-wrapper">
<h1 class="brand-title">Capacita<span class="brand-pro">Pro</span></h1>
<span class="brand-subtitle">TREINAMENTOS PROFISSIONAIS</span>
</div>
</a>
</header>

<main class="login-main-container">

<div class="login-grid">
<div class="login-left">
<h2 class="login-title">Faça seu Login</h2>
<p class="login-subtitle">Bem-vindo de volta! Insira suas informações para acessar sua conta.</p>

<div class="glass-panel form-card">
<form id="loginForm"> <!-- ⚠️ ADICIONEI O ID "loginForm" -->
<div class="input-group">
<i class="fas fa-envelope icon-left"></i>
<input type="text" class="glass-input" placeholder="E-mail ou Número de Matrícula" id="emailInput"> <!-- ⚠️ ADICIONEI O ID -->
</div>

<div class="input-group">
<i class="fas fa-lock icon-left"></i>
<input type="password" class="glass-input" placeholder="Senha" id="passwordInput"> <!-- ⚠️ ADICIONEI O ID -->
<i class="fas fa-eye icon-right" onclick="togglePassword('passwordInput', this)"></i> <!-- ⚠️ ADICIONEI A FUNÇÃO -->
</div>

<div class="checkbox-group">
<label>
<input type="checkbox" checked>
<span class="custom-checkbox"><i class="fas fa-check"></i></span>
Lembrar-me
</label>
</div>

<!-- ✅ BOTÃO ENTRAR - MUDOU PARA type="submit" -->
<button type="submit" class="btn-green-block" style="display: block; text-align: center; width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; background: linear-gradient(to right, #4caf50, #2af598); color: #004aad;">
Entrar
</button>
</form>

<!-- 🔵 DIVISOR "ou" - ADICIONADO -->
<div class="separator" style="margin: 25px 0; display: flex; align-items: center; gap: 15px; color: rgba(255,255,255,0.6);">
<hr style="flex: 1; border-color: rgba(255,255,255,0.2);">
<span style="font-size: 0.85rem;">ou</span>
<hr style="flex: 1; border-color: rgba(255,255,255,0.2);">
</div>

<!-- 🔵 BOTÃO "ENTRAR COM GOOGLE" - ADICIONADO -->
<div id="googleButtonContainer" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

<div class="form-links" style="text-align: center; margin-top: 20px;">
<div class="divider" style="margin-bottom: 15px;">
<a href="#" style="color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem;">Esqueceu sua senha?</a>
</div>

<p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 10px;">Ainda não tem uma conta?</p>

<a href="cadastro.html" class="btn-cadastrar-link">
Cadastrar-se
</a>
</div>
</div>
</div>
</div>

</main>

<footer class="login-footer" style="text-align: center; padding: 30px 20px;">
<p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 10px;">Ainda não tem uma conta?</p>

<a href="cadastro.html" class="btn-cadastrar-small">
Cadastrar-se
</a>
</footer>

<!-- 🔵 SCRIPT DO GOOGLE - ADICIONADO AQUI -->
<script>
// ==========================================
// 🔵 CONFIGURAÇÃO DO LOGIN COM GOOGLE
// ==========================================

// ⚠️ COLE AQUI O SEU CLIENT ID (que você copiou do Google Cloud)
const GOOGLE_CLIENT_ID = "SEU_CLIENT_ID_AQUI.apps.googleusercontent.com";

// Função chamada após login com Google
function handleGoogleLogin(response) {
console.log("✅ Login com Google realizado!");

try {
const token = response.credential;
const payload = parseJwt(token);

console.log("👤 Dados do usuário:", payload);

// Salva os dados do usuário
sessionStorage.setItem('user', JSON.stringify({
nome: payload.name,
email: payload.email,
picture: payload.picture,
sub: payload.sub
}));

// Redireciona para a página inicial
window.location.href = "inicio.html";

} catch (error) {
console.error("❌ Erro ao processar login:", error);
alert("Erro ao fazer login com Google. Tente novamente.");
}
}

// Função para decodificar o token JWT
function parseJwt(token) {
const base64Url = token.split('.')[1];
const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
}).join(''));
return JSON.parse(jsonPayload);
}

// Inicializa o botão do Google
function initializeGoogleButton() {
if (typeof google !== 'undefined' && GOOGLE_CLIENT_ID !== "SEU_CLIENT_ID_AQUI.apps.googleusercontent.com") {
google.accounts.id.initialize({
client_id: GOOGLE_CLIENT_ID,
callback: handleGoogleLogin,
cancel_on_tap_outside: false
});

google.accounts.id.renderButton(
document.getElementById('googleButtonContainer'),
{
theme: 'outline',
size: 'large',
width: '100%',
type: 'standard',
shape: 'pill',
text: 'continue_with',
logo_alignment: 'left'
}
);
} else if (GOOGLE_CLIENT_ID === "SEU_CLIENT_ID_AQUI.apps.googleusercontent.com") {
console.warn("⚠️ Substitua GOOGLE_CLIENT_ID pelo seu Client ID do Google");
document.getElementById('googleButtonContainer').innerHTML =
'<p style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">Configure o Client ID do Google</p>';
} else {
console.warn("⏳ Aguardando carregamento da biblioteca Google...");
setTimeout(initializeGoogleButton, 500);
}
}

// ==========================================
// LOGIN TRADICIONAL
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
// Inicializa o botão do Google
setTimeout(initializeGoogleButton, 1000);

// Login tradicional
const loginForm = document.getElementById('loginForm');
if (loginForm) {
loginForm.addEventListener('submit', function(e) {
e.preventDefault();

const email = document.getElementById('emailInput')?.value || '';
const senha = document.getElementById('passwordInput')?.value || '';

if (email && senha) {
if (email.includes('@') && senha.length >= 6) {
sessionStorage.setItem('user', JSON.stringify({
nome: email.split('@')[0],
email: email,
picture: null
}));
window.location.href = "inicio.html";
} else {
alert('⚠️ E-mail ou senha inválidos.');
}
} else {
alert('⚠️ Por favor, preencha todos os campos.');
}
});
}
});
</script>

<script src="script.js"></script>
</body>
</html>
