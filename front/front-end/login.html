<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CapacitaPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <header class="navbar">
        <a href="index.html" class="logo-link" style="display: flex; align-items: center; text-decoration: none;">
            <img src="png.logo.png" alt="Logo CapacitaPro" style="width: 45px; height: 45px; margin-right: 12px;">
            <div class="logo-text-wrapper">
                <h1 class="brand-title">Capacita<span class="brand-pro">Pro</span></h1>
                <span class="brand-subtitle">TREINAMENTOS PROFISSIONAIS</span>
            </div>
        </a>
    </header>

    <main class="login-main-container">
        
        <div class="login-grid">
            <div class="login-left">
                <h2 class="login-title">Faça seu Login</h2>
                <p class="login-subtitle">Bem-vindo de volta! Insira suas informações para acessar sua conta.</p>

                <div class="glass-panel form-card">
                    <form>
                        <div class="input-group">
                            <i class="fas fa-envelope icon-left"></i>
                            <input type="text" class="glass-input" placeholder="E-mail ou Número de Matrícula">
                        </div>
                        
                        <div class="input-group">
                            <i class="fas fa-lock icon-left"></i>
                            <input type="password" class="glass-input" placeholder="Senha">
                            <i class="fas fa-eye icon-right"></i>
                        </div>

                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" checked>
                                <span class="custom-checkbox"><i class="fas fa-check"></i></span>
                                Lembrar-me
                            </label>
                        </div>

                        <!-- ✅ BOTÃO ENTRAR -->
                        <a href="inicio.html" class="btn-green-block" style="display: block; text-align: center; text-decoration: none; width: 100%; padding: 15px; border-radius: 8px; box-sizing: border-box;">
                            Entrar
                        </a>
                    </form>

                    <div class="form-links" style="text-align: center; margin-top: 20px;">
                        <div class="divider" style="margin-bottom: 15px;">
                            <a href="#" style="color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem;">Esqueceu sua senha?</a>
                        </div>
                        
                        <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 10px;">Ainda não tem uma conta?</p>
                        
                        <!-- ✅ BOTÃO CADASTRAR (QUADRADO) -->
                        <a href="cadastro.html" class="btn-cadastrar-link">
                            Cadastrar-se
                        </a>
                    </div>
                </div>
            </div>
        </div>
           
    </main>

    <footer class="login-footer" style="text-align: center; padding: 30px 20px;">
        <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 10px;">Ainda não tem uma conta?</p>
        
        <!-- ✅ BOTÃO CADASTRAR (VERSÃO MENOR PARA O FOOTER) -->
        <a href="cadastro.html" class="btn-cadastrar-small">
            Cadastrar-se
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
