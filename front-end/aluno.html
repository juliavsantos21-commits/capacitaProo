<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapacitaPro - Área do Aluno</title>
    <link rel="stylesheet" href="aluno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho / Navbar -->
    <header class="navbar">
        <div class="logo">
            <div class="logo-content">
                <img src="png.logo.png" alt="Ícone CapacitaPro" class="logo-icon">
                <div class="logo-text">
                    <h1>CapacitaPro</h1>
                    <span>TREINAMENTOS PROFISSIONAIS</span>
                </div>
            </div>
        </div>
        
        <!-- Área do Usuário Clicável para o Perfil -->
        <a href="perfil.html" class="user-profile" style="text-decoration: none; color: inherit; cursor: pointer;">
            <span class="user-name" id="nome-aluno-header">Olá, <strong>Aluno(a)</strong></span>
            <div class="user-avatar" id="avatar-aluno-header">A</div>
        </a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        
        <!-- Banner de Boas-vindas -->
        <section class="welcome-banner">
            <div class="banner-content">
                <h1>Bem-vindo(a) de volta! 🚀</h1>
                <p>Acompanhe seus treinamentos e continue de onde parou.</p>
            </div>
        </section>

        <!-- Seção de Cursos em Andamento -->
        <section class="courses-section">
            <h2 class="section-title">Meu Curso de Capacitação</h2>
            
            <div class="courses-grid" style="display: flex; justify-content: center;">
                
                <!-- CARD DINÂMICO DO CURSO SELECIONADO -->
                <article class="course-card" style="width: 100%; max-width: 450px;">
                    <div class="card-header">
                        <span class="course-tag" id="tag-area-aluno">Área Selecionada</span>
                        <h3 class="course-title" id="curso-aluno">Carregando curso...</h3>
                        <p class="course-desc">Seu curso em andamento na plataforma CapacitaPro.</p>
                    </div>
                    <div class="card-footer">
                        <div class="progress-container">
                            <div class="progress-info">
                                <span>Progresso</span>
                                <span>0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 0%;"></div>
                            </div>
                        </div>
                        <a href="aula.html" class="btn-primary" style="text-decoration: none; text-align: center; display: block; margin-top: 15px;">Iniciar Aula</a>
                    </div>
                </article>

            </div>
        </section>

    </main>

    <!-- BIBLIOTECA JSPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Script JS do projeto -->
    <script src="script.js"></script>

</body>
</html>
