<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CapacitaPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <header class="navbar">
        <a href="index.html" class="logo-link" style="display: flex; align-items: center; text-decoration: none;">
            <img src="png.logo.png" alt="Logo CapacitaPro" style="width: 45px; height: 45px; margin-right: 12px;">
            <div class="logo-text-wrapper">
                <h1 class="brand-title">Capacita<span class="brand-pro">Pro</span></h1>
                <span class="brand-subtitle">TREINAMENTOS PROFISSIONAIS</span>
            </div>
        </a>
    </header>

    <main class="login-main-container">
        
        <div class="login-grid">
            <div class="login-left">
                <h2 class="login-title">Faça seu Login</h2>
                <p class="login-subtitle">Bem-vindo de volta! Insira suas informações para acessar sua conta.</p>

                <div class="glass-panel form-card">
                    <form id="form-login" onsubmit="return false;">
                        <div class="input-group">
                            <i class="fas fa-envelope icon-left"></i>
                            <input type="text" id="login-email" class="glass-input" placeholder="E-mail ou Número de Matrícula" required>
                        </div>
                        
                        <div class="input-group">
                            <i class="fas fa-lock icon-left"></i>
                            <input type="password" id="login-senha" class="glass-input" placeholder="Senha" required>
                            <i class="fas fa-eye icon-right" style="cursor: pointer;" title="Mostrar Senha"></i>
                        </div>

                        <button type="submit" class="btn-green-block">Entrar</button>

                        <!-- Botão do Google adicionado -->
                        <button type="button" id="btn-google" class="btn-google-block">
                            <i class="fab fa-google"></i> Entrar com o Google
                        </button>
                    </form>

                    <div class="form-links">
                        <div class="divider">
                            <span>Esqueceu sua senha?</span>
                        </div>
                        <p>Ainda não tem uma conta?</p>
                        <a href="cadastro.html" style="color: #4cd137; text-decoration: none; font-weight: bold;">Cadastrar-se</a>
                    </div>
                </div>
            </div>
        </div>
            
    </main>

    <footer class="login-footer">
        <p>Ainda não tem uma conta? <a href="cadastro.html" style="color: #4cd137; text-decoration: none; font-weight: bold;">Cadastrar-se</a></p>
    </footer>

    <!-- Scripts do Firebase adicionados antes do script.js -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
